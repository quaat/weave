# REUSE tools read REUSE.toml, not REUSE.yaml.
# Reflects the MIT grant and copyright notice already recorded in LICENSE and
# README.md. Contributions use the same terms, as stated in README.md.
# Exact paths deliberately prevent future third-party imports inheriting MIT.
# New files need reviewed annotations or SPDX headers of their own.
# "closest" preserves licensing/copyright in file headers or .license sidecars.
# Pinned snapshots are annotated here without changing their bytes or hashes.
# This metadata is not a completed provenance audit; see follow-up.
