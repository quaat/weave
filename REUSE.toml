# PDFs with embedded third-party font programs (FU-01, resolved).
# Each PDF is one file that combines Weave-authored content (MIT) with subsets
# of font programs under their own licences. All of these terms apply to the
# file at once, so the expression joins them with AND, not OR.
# Evidence (see docs/decisions/0002-licence-terms.md and the "Third-party
# notices" section of specification/docs/chapters/provenance.rst):
# - DejaVu fonts: identified from pdffonts names, the subsets' own name tables
#   (specimen) and glyph outlines identical to DejaVu Sans 2.37 (diagrams).
#   Their licence string names the Bitstream Vera licence (SPDX Bitstream-Vera)
