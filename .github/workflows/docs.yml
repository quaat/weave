name: Specification site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "specification/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HTML and PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: specification/requirements.txt
      - name: Install TeX Live and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make latexmk \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-english fonts-dejavu
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build HTML
        run: make html PYTHON=python
      - name: Build PDF
        run: make latexpdf PYTHON=python
      - name: Report LaTeX warnings
        run: |
          grep -E "Missing character|undefined|LaTeX Warning" _build/latex/weave-specification.log \
            | sed 's/^/::warning title=LaTeX::/' || true
      - name: Assemble site
        run: |
          cp _build/latex/weave-specification.pdf _build/html/weave-specification.pdf
          touch _build/html/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: weave-specification-pdf
          path: specification/_build/latex/weave-specification.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: specification/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
