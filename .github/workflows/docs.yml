name: Specification site

# Publishes the specification to GitHub Pages:
#   /               multi-page edition with full-text search (default)
#   /single-page/   single-page edition (one HTML document)
# The PDF needs TeX Live and is built separately by pdf.yml.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "specification/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deployment from main part-way; superseded PR builds may stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site (multi-page, single page)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: specification/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build multi-page edition
        run: make html PYTHON=python
      - name: Build single-page edition
        run: make singlehtml PYTHON=python
        env:
          # Its sidebar search uses the multi-page edition's index at the site root.
          WEAVE_SINGLEHTML_SEARCH_URL: ../search.html
      - name: Assemble site
        run: |
          rm -rf _site
          cp -r _build/html _site
          cp -r _build/singlehtml _site/single-page
      - name: Audit links, form targets, anchors and assets
        run: python scripts/audit_html.py _site
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: specification/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        env:
          # deploy-pages v5.0.1 bundles a dependency that uses Node's deprecated
          # punycode module (actions/deploy-pages#413, #433, #434). Silence only
          # that warning; remove once a fixed release is available.
          NODE_OPTIONS: --disable-warning=DEP0040
