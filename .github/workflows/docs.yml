name: Specification site

# Publishes the specification to GitHub Pages:
#   /                          single-page edition (one HTML document)
#   /multipage/                multi-page edition with full-text search
#   /weave-specification.pdf   XeLaTeX PDF

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "specification/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deployment from main part-way; superseded PR builds may stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site (single page, multi-page, PDF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: specification/requirements.txt
      - name: Install TeX Live and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make latexmk \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-english fonts-dejavu
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build single-page edition
        run: make singlehtml PYTHON=python
      - name: Build multi-page edition
        run: make html PYTHON=python
      - name: Build PDF
        run: make latexpdf PYTHON=python
      - name: Report LaTeX warnings
        run: |
          grep -E "Missing character|undefined|LaTeX Warning" _build/latex/weave-specification.log \
            | sed 's/^/::warning title=LaTeX::/' || true
      - name: Assemble site
        run: |
          rm -rf _site
          cp -r _build/singlehtml _site
          cp -r _build/html _site/multipage
          cp _build/latex/weave-specification.pdf _site/weave-specification.pdf
      - name: Audit links, anchors and assets
        run: python scripts/audit_html.py _site
      - uses: actions/upload-artifact@v7
        with:
          name: weave-specification-pdf
          path: specification/_build/latex/weave-specification.pdf
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: specification/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
