name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  inventory-proof:
    name: inventory-proof (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: inventory-proof
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo regenerates committed outputs
        run: |
          python demo.py
          git diff --exit-code -- .
      - name: Process-crash reference model
        run: python durable.py

  agent-kit:
    name: agent-kit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: agent-kit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Environment check
        run: python scripts/weave.py doctor
      - name: Kit tests
        run: python -B -m unittest discover -s tests -v
      - name: Teaching example expectations
        run: python scripts/weave.py examples
      - name: Bundled prototype regression suite
        run: python scripts/weave.py test
      - name: Demo tests
        run: |
          for demo in demos/*/; do
            echo "::group::$demo"
            (cd "$demo" && python -B -m unittest discover -s tests -v)
            echo "::endgroup::"
          done

  rust:
    name: rust (weave-syntax)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (corpus round trip, spans, diagnostics, adversarial input)
        run: cargo test --all

  specification:
    name: specification (validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: specification/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The grammar audit compares the Rust parser with the generated parser when the
      # weave-syntax binary is available; without it the comparison is not established.
      - name: Build the weave-syntax binary for the grammar audit
        working-directory: .
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          cargo build --locked -p weave-syntax --bin weave-syntax
          echo "WEAVE_SYNTAX_BIN=$GITHUB_WORKSPACE/target/debug/weave-syntax" >> "$GITHUB_ENV"
      - name: Validate (examples, grammar, Rust differential, tests, strict HTML, link audit)
        run: make validate-offline PYTHON=python
      - name: Single-page and text editions
        run: |
          make singlehtml text PYTHON=python
          python scripts/audit_html.py _build/singlehtml

  workflow:
    name: workflow tooling and documentation audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Workflow tests (offline; fake GitHub and Codex adapters)
        run: python -m unittest discover -s tools/weave_workflow/tests -t . -v
      - name: Documentation drift audit (whole repository)
        run: python -m tools.weave_workflow docs-audit
      - name: Documentation map is current
        run: python -m tools.weave_workflow docs-map
