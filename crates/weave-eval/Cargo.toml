[package]
name = "weave-eval"
version = "0.1.0"
description = "P0 evaluator: exact integers, persistent lists and records, Euclidean division, explicit call frames, fuel, depth and integer-size budgets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
weave-check = { path = "../weave-check" }
weave-syntax = { path = "../weave-syntax" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
